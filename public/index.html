<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Ferry</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark">⛴</span>
      <span class="brand-name">Ferry</span>
    </div>
    <button id="changelogBtn" class="link-btn" title="What's new">What's New</button>
  </header>

  <main>
    <div id="updateBanner" class="update-banner" hidden>
      <span id="updateBannerText"></span>
      <button id="updateBannerBtn" class="link-btn">Download</button>
    </div>

    <section class="folders">
      <div class="folder-row">
        <div class="folder-label">Departure</div>
        <div class="folder-path" id="departurePath" title="Choose a folder to move everything in it, or choose specific files.">
          <span id="departurePathText" class="truncate">No folder or files selected</span><span id="departureCount" class="folder-count"></span>
        </div>
        <button id="selectDeparture" class="btn">Select…</button>
      </div>
      <div class="folder-arrow">→</div>
      <div class="folder-row">
        <div class="folder-label">Arrival</div>
        <div class="folder-path truncate" id="arrivalPath">No folder selected</div>
        <button id="selectArrival" class="btn">Select…</button>
      </div>
    </section>

    <div class="mode-toggle" id="modeToggle" role="group" aria-label="Move or copy">
      <button type="button" class="mode-btn active" id="modeMoveBtn" data-mode="move" title="Delete files from Departure after they arrive">Move</button>
      <button type="button" class="mode-btn" id="modeCopyBtn" data-mode="copy" title="Leave the originals in Departure untouched">Copy</button>
    </div>

    <section class="controls">
      <button id="startBtn" class="btn btn-primary">Start Transfer</button>
      <button id="pauseAfterBtn" class="btn" disabled>Pause After This Transfer</button>
      <button id="cancelBtn" class="btn btn-danger" disabled>Cancel</button>
    </section>

    <section class="queue-section">
      <div class="queue-header">
        <span id="queueHeaderLabel">Queue</span>
        <select id="sortSelect" class="text-input sort-select">
          <option value="name-asc">Name (A→Z)</option>
          <option value="name-desc">Name (Z→A)</option>
          <option value="size-desc">Size (largest first)</option>
          <option value="size-asc">Size (smallest first)</option>
          <option value="date-desc">Date modified (newest first)</option>
          <option value="date-asc">Date modified (oldest first)</option>
        </select>
      </div>
      <ul id="queueList" class="queue-list"></ul>
    </section>

    <section class="progress-section" id="progressSection" hidden>
      <div class="progress-meta">
        <span id="progressFileName">—</span>
        <span id="progressCount">0 / 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <div class="progress-detail" id="progressDetail" hidden></div>
      <div class="status-line" id="statusLine"></div>
    </section>

    <section class="log-section">
      <div class="log-header">Activity</div>
      <ul id="logList" class="log-list"></ul>
    </section>

    <section class="notify-section">
      <label class="notify-toggle">
        <input type="checkbox" id="ntfyEnabled" />
        Notify via ntfy when a transfer finishes
      </label>
      <div class="notify-fields">
        <input type="text" id="ntfyTopic" class="text-input" placeholder="ntfy topic" />
        <input type="text" id="ntfyServer" class="text-input" placeholder="https://ntfy.sh" />
      </div>
    </section>
  </main>

  <div id="changelogModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>What's New</h2>
        <button id="closeChangelog" class="link-btn">Close</button>
      </div>
      <div id="changelogBody" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
